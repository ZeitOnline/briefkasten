---
name: Backend CI
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
concurrency:
  group: backend
  cancel-in-progress: true
jobs:
  linter:
    uses: zeitonline/gh-action-workflows/.github/workflows/lefthook.yaml@1a5bf2aa58666b66ac230c9087df7fd257b1ce2f # 4.2.0
    with:
      setup-command: |
        uv sync --active --frozen --only-group lint --project deployment/
  # run 'release-please' first
  release-please:
    needs: linter
    uses: zeitonline/gh-action-workflows/.github/workflows/release-please.yaml@1a5bf2aa58666b66ac230c9087df7fd257b1ce2f # 4.2.0
    secrets: inherit
  # without release: run tests
  build:
    needs: release-please
    if: ${{ ! needs.release-please.outputs.release_created }}
    uses: zeitonline/gh-action-workflows/.github/workflows/build-test-push.yaml@1a5bf2aa58666b66ac230c9087df7fd257b1ce2f # 4.2.0
    secrets: inherit
  # with release: notify
  notify:
    needs: release-please
    if: needs.release-please.outputs.release_created
    uses: zeitonline/gh-action-workflows/.github/workflows/release-notification.yaml@1a5bf2aa58666b66ac230c9087df7fd257b1ce2f # 4.2.0
    secrets: inherit
    with:
      environment: production
      version: ${{ needs.release-please.outputs.tag_name }}
      emoji: mailbox
