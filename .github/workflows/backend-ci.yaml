---
name: Backend CI
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
concurrency:
  group: backend
  cancel-in-progress: true
jobs:
  linter:
    uses: zeitonline/gh-action-workflows/.github/workflows/lefthook.yaml@f9996e6319d9fe72056ba3eb2d1378748c479f64 # 4.7.0
    with:
      setup-command: |
        uv sync --active --frozen --only-group lint --project deployment/
  # run 'release-please' first
  release-please:
    needs: linter
    uses: zeitonline/gh-action-workflows/.github/workflows/release-please.yaml@f9996e6319d9fe72056ba3eb2d1378748c479f64 # 4.7.0
    secrets: inherit
  # without release: run tests
  build:
    needs: release-please
    if: ${{ ! needs.release-please.outputs.release_created }}
    uses: zeitonline/gh-action-workflows/.github/workflows/build-test-push.yaml@f9996e6319d9fe72056ba3eb2d1378748c479f64 # 4.7.0
    secrets: inherit
  # with release: notify
  notify:
    needs: release-please
    if: needs.release-please.outputs.release_created
    uses: zeitonline/gh-action-workflows/.github/workflows/release-notification.yaml@f9996e6319d9fe72056ba3eb2d1378748c479f64 # 4.7.0
    secrets: inherit
    with:
      environment: production
      version: ${{ needs.release-please.outputs.tag_name }}
      emoji: mailbox
