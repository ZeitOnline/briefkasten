---
name: Test backend
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'
    paths:
      - '.github/workflows/backend-tests.yaml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'testing.yaml'
      - 'application/briefkasten/**'
      - 'application/Pipfile**'
      - 'application/pyproject.toml'
      - 'application/uv.lock'
      - 'application/setup.*'
      - 'application/tox.ini'
jobs:
  build:
    uses: zeitonline/gh-action-workflows/.github/workflows/build-test-push.yaml@7c0cccffb89e545f3c37312433c7810432107003 # 4.7.3
