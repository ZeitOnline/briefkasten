---
name: Test backend
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'
    paths:
      - '.github/workflows/backend-tests.yaml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'testing.yaml'
      - 'application/briefkasten/**'
      - 'application/Pipfile**'
      - 'application/pyproject.toml'
      - 'application/uv.lock'
      - 'application/setup.*'
      - 'application/tox.ini'
jobs:
  build:
    uses: zeitonline/gh-action-workflows/.github/workflows/build-test-push.yaml@1a5bf2aa58666b66ac230c9087df7fd257b1ce2f # 4.2.0
